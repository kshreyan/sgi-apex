[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgi-apex"
version = "0.1.0"
description = "SGI APEX — Chairman's Intelligence and Prediction Operating System (milestone 1: admissions loop)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sgi = "sgi_apex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]
